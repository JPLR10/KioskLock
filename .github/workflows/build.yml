name: Build KioskLock

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build unsigned release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Sign APK with the KioskLock release key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-key-alias kiosklock \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --out KioskLock.apk aligned.apk
          "$BT/apksigner" verify KioskLock.apk
          rm release.jks

      - name: Make setup QR code
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          pip install qrcode[pil]
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          keytool -exportcert -keystore release.jks -alias kiosklock \
            -storepass "$KEYSTORE_PASSWORD" > cert.der
          rm release.jks
          python3 tools/make_qr.py \
            --apk-url "https://github.com/${{ github.repository }}/releases/latest/download/KioskLock.apk" \
            --cert cert.der --out setup-qr.png --json-out setup-qr.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" KioskLock.apk setup-qr.png setup-qr.json \
            --title "KioskLock $TAG" --notes "Scan setup-qr.png on a freshly reset tablet." --latest
